# Zet bij een nieuw review-issue een label op basis van het gekozen "Soort commentaar".
# Issue forms kunnen labels alleen statisch zetten; deze workflow maakt ze dynamisch.
name: Review-labels

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label:
    # herkennen aan het formulier; labels die nog niet bestaan maakt addLabels zelf aan
    if: contains(github.event.issue.body, '### Soort commentaar')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";
            const map = {
              "Redactioneel": "type: redactioneel",
              "Inhoudelijk": "type: inhoudelijk",
              "Structureel": "type: structureel",
              "Breaking change": "type: breaking",
              "Vraag": "type: vraag",
            };
            const typeMatch = body.match(/### Soort commentaar\s+([^\n]+)/);
            const labels = ["review"];
            if (typeMatch) {
              for (const [k, v] of Object.entries(map)) if (typeMatch[1].startsWith(k)) labels.push(v);
            }
            const model = body.match(/### Model\s+([^\n]+)/)?.[1]?.trim();
            const versie = body.match(/### Versie\s+([^\n]+)/)?.[1]?.trim();
            if (model && model !== "_No response_") labels.push(`model: ${model}`.slice(0, 50));
            if (versie && versie !== "_No response_") labels.push(`versie: ${versie}`.slice(0, 50));
            if (context.payload.action === "opened") labels.push("status: nieuw");
            {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: context.issue.number,
                labels,
              });
            }
